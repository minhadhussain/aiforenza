[project]
name = "api"
version = "0.1.0"
description = "FastAPI application for the AI model credit platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "anyio==4.10.0",
  "httpx==0.28.1",
  "posthog==6.7.11",
  "pydantic-settings==2.10.1",
  "redis==6.2.0",
  "sentry-sdk==2.22.0",
  "stripe==13.0.0",
  "tiktoken==0.12.0",
  "uvicorn[standard]==0.35.0"
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
